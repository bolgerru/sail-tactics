; The iOS export preset. godot/tools/ios/make_ios_preset.py merges it into export_presets.cfg at build
; time and fills in the team ID, provisioning profile and build number. It lives here rather than in
; export_presets.cfg because an open Godot editor rewrites that file from memory whenever it exports,
; dropping presets it never loaded.

[preset]

name="iOS"
platform="iOS"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, store/*, build/*"
export_path=""
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.options]

custom_template/debug=""
custom_template/release=""
application/app_store_team_id=""
application/export_method_debug=1
application/code_sign_identity_debug=""
application/code_sign_identity_release="Apple Distribution"
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""
application/provisioning_profile_specifier_debug=""
application/provisioning_profile_specifier_release=""
application/export_method_release=0
application/targeted_device_family=0
application/bundle_identifier="com.russell.sailtactics"
application/signature=""
application/short_version="1.0.0"
application/version="1"
application/additional_plist_content=""
application/icon_interpolation=4
application/export_project_only=true
application/delete_old_export_files_unconditionally=false
entitlements/increased_memory_limit=false
entitlements/game_center=false
capabilities/access_wifi=false
capabilities/performance_gaming_tier=false
capabilities/performance_a12=false
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/camera_usage_description="Sail Tactics never uses the camera."
privacy/microphone_usage_description="Sail Tactics never uses the microphone."
privacy/photolibrary_usage_description="Sail Tactics never uses your photos."
privacy/tracking_enabled=false
privacy/tracking_domains=PackedStringArray()
icons/icon_1024x1024="res://icon.png"
storyboard/image_scale_mode=0
storyboard/custom_image@2x="res://assets/launch@2x.png"
storyboard/custom_image@3x="res://assets/launch@3x.png"
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0, 0.4667, 0.7451, 1)
